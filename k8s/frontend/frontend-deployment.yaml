
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbite-frontend
  namespace: quickbite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickbite-frontend
  template:
    metadata:
      labels:
        app: quickbite-frontend
    spec:
      containers:
        - name: frontend
          image: quickbite-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
